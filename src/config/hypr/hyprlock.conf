background {
    monitor =
    path = ~/Pictures/Wallpapers/nebula.jpg
    blur_passes = 1
    blur_size = 3
    noise = 0.0117
    contrast = 0.9989
    vibrancy = 0.1296
    vibrancy_darkness = 0.0
}
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(255, 255, 255, 0.05) 
    outer_color = rgba(9c1205ee) rgba(000000ee) 45deg
    check_color=rgba(5050ccee) rgba(ccccccee) 120deg
    fail_color=rgba(909090ee) rgba(ccccccee) 40deg
    placeholder_text =
    fail_text = ACCESS DENIED
    font_family = Odin Rounded Bold
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}


